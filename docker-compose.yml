services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: playable-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: playable
      POSTGRES_PASSWORD: playable
      POSTGRES_DB: playable_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playable -d playable_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
